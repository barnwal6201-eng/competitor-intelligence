# Render Blueprint — Competitor Intelligence SaaS
# =================================================
# The WHOLE project deploys on Render — frontend, API, worker, Redis.
# No Vercel needed. Deploy with the Render dashboard (no CLI, no
# account creation here):
#   1. Push this repo to GitHub (Render deploys from a connected repo).
#   2. Render dashboard → New → Blueprint → connect the repo.
#      Render reads this file and creates all three services below.
#   3. Render prompts for every secret marked `sync: false` — paste the
#      real values there (dashboard only). NOTHING secret is in this file.
#   4. The frontend's NEXT_PUBLIC_API_URL is wired automatically from
#      the API service (fromService), so the two services find each
#      other with no manual step. FRONTEND_URL is pre-filled with the
#      frontend service's expected URL — if the dashboard shows a
#      different subdomain, correct it on the API + worker services and
#      redeploy them (see backend/DEPLOYMENT.md, steps 2–3).
#
# Services created:
#   competitor-intelligence-frontend  Node web service  (Next.js, port from $PORT)
#   competitor-intelligence-api       Node web service  (Express API, port from $PORT)
#   competitor-intelligence-redis     free Redis Key Value (BullMQ queue backend)
#
# NOTE (free tier): Render Background Workers are NOT available on the
# free plan, so there is no separate worker service. The API runs the
# BullMQ scan worker in-process instead (SCAN_WORKER_IN_PROCESS=true
# below) - the same mode local `npm run dev` uses.
#
# Plans are all free tier. Render free web services sleep after ~15 min of
# inactivity (first request after sleep is slow); free Redis has limits —
# see DEPLOYMENT.md section 8.

services:
  # --- Frontend ------------------------------------------------------------
  # Next.js runs as a Node web service (not a static site: the app uses
  # server components, middleware and cookies). Render injects PORT
  # automatically; `next start` listens on it.
  - type: web
    name: competitor-intelligence-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # Wired automatically from the API service below (fromService gives
      # the bare hostname; the frontend code adds https:// — see
      # frontend/services/apiUrl.ts). NEXT_PUBLIC_ values are baked into
      # the frontend at build time, so this must be set before the first
      # build — the Blueprint does that.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: competitor-intelligence-api
          property: host

  # --- API ---------------------------------------------------------------
  - type: web
    name: competitor-intelligence-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is REQUIRED: NODE_ENV=production (below) makes plain
    # `npm install` skip devDependencies — and TypeScript + @types/node
    # are devDependencies. Without them the build falls back to a global
    # tsc with no Node types and fails on 'process' / 'console' /
    # 'setTimeout'. With dev deps installed, the lockfile's TS 5.9.3 is used.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Background Workers are not on Render's free plan, so the API runs
      # the scan worker in-process (same as local `npm run dev`).
      - key: SCAN_WORKER_IN_PROCESS
        value: "true"
      # Render injects PORT automatically; the backend listens on it
      # (default 5000 locally). Do not set PORT here.
      # FRONTEND_URL: pre-filled with the frontend service's expected
      # URL. If the dashboard shows a different subdomain, correct it
      # here (and on the worker) and redeploy. Until it matches the
      # frontend URL exactly, CORS blocks the frontend and the login
      # cookie is not accepted.
      - key: FRONTEND_URL
        value: https://competitor-intelligence-frontend.onrender.com
      # Redis connection string, wired from the Key Value service below.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: competitor-intelligence-redis
          property: connectionString
      # Secrets — Render prompts for these in the dashboard (sync: false
      # means "ask me, don't read a value from this file"). Never paste
      # a real value here.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: NOTION_REDIRECT_URI
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_REDIRECT_URI
        sync: false
      # Non-secret settings (safe to keep as plain values).
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: SCAN_WORKER_CONCURRENCY
        value: "2"
      - key: SALESFORCE_LOGIN_URL
        value: https://login.salesforce.com

  # --- Redis (BullMQ queue) ----------------------------------------------
  # BullMQ requires noeviction: if Redis evicted queued jobs under memory
  # pressure, scheduled scans would silently disappear.
  # Render requires an IP allow list on Redis services in a Blueprint.
  # Render's own services have no fixed outbound IPs on the free tier,
  # so 0.0.0.0/0 is used here — access is still protected by the
  # auto-generated Redis password in the connection string.
  - type: keyvalue
    name: competitor-intelligence-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow Render services to connect (password-protected)
